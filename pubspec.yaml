name: naql_customer
description: منصة نقل الأثاث - تطبيق العميل
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Dependency Injection
  get_it: ^7.7.0

  # Maps - FREE, no API key, works in Syria
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location
  geolocator: ^11.0.0

  # Real-time
  socket_io_client: ^2.0.3+1

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # UI
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
